name: GitHub-Profile-3D-City

on:
  schedule: # Runs automatically daily
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows you to run it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v3
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Remove contributions counter overlay
        run: |
          python3 - <<'EOF'
          import glob, re

          for path in glob.glob("profile-3d-contrib/*.svg"):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              content = re.sub(r'<text[^>]*font-weight: bold;"[^>]*>\d+</text>', "", content)
              content = re.sub(r'<text[^>]*>contributions</text>', "", content)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
          EOF
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "build: generated 3d city grid"
          git push
