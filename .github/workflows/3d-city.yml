name: GitHub-Profile-3D-City

on:
  schedule: # Runs automatically daily
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows you to run it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v3
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Keep only the city (strip radar, donut and stats overlay)
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          import glob

          ET.register_namespace("", "http://www.w3.org/2000/svg")
          ns = "{http://www.w3.org/2000/svg}"

          for path in glob.glob("profile-3d-contrib/*.svg"):
              tree = ET.parse(path)
              root = tree.getroot()
              g_children = [c for c in root if c.tag.replace(ns, "") == "g"]
              # the city grid is the group with by far the most children (one per building);
              # the radar chart, language donut and stats/star/fork overlay are the smaller groups
              city = max(g_children, key=lambda c: len(list(c)))
              for c in g_children:
                  if c is not city:
                      root.remove(c)
              tree.write(path, encoding="utf-8", xml_declaration=False)
          EOF
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "build: generated 3d city grid"
          git push
