name: Update ID Badge & README

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install Pillow requests
      - run: python id_badge.py
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      - run: python update_readme.py
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add id_badge_light.svg id_badge_dark.svg README.md
          git diff --cached --quiet || (git commit -m "Update ID badge & README" && git push)
